name: Build and Push Gradio VLA Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_NAMESPACE: hwstaff_l00392796
  IMAGE_NAME: gradio-vla

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Login to SWR
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | docker login ${{ env.SWR_REGISTRY }} -u "${{ secrets.SWR_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build -t ${{ steps.tag.outputs.full_image }} .

      - name: Push image
        run: |
          docker push ${{ steps.tag.outputs.full_image }}

      - name: Also tag and push latest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ${{ steps.tag.outputs.full_image }} ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
